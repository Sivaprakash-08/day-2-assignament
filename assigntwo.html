<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
          .say{
            color: chocolate;
          }
          .shock{
            color: crimson;
          }
    </style>
</head>
<body>
    <button id="show">don't do it</button>
    <h1 id="showlable"></h1>

    <script>
         
        var boolean ;
        const button = document.getElementById('show');
         const h1 = document.getElementById('showlable');
         button.addEventListener('click' ,function(){
            boolean = !boolean;
           h1.textContent = `${(boolean?"wait a minute":"who are you")}`
            h1.className = `${(boolean?"say":"shock")}`
         })
    </script>
</body>
</html>
